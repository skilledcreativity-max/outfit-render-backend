services:
  - type: web
    runtime: node
    name: outfit-render-backend
    buildCommand: npm ci --ignore-scripts && npm run audit && npm test
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: RENDER_API_KEY
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "false"
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: APPROVED_PATTERN_ASSET_IDS
        sync: false
      - key: APPROVED_GRAPHIC_ASSET_IDS
        sync: false
      - key: RENDER_MAX_REQUESTS_PER_MINUTE
        value: "30"
      - key: RENDER_MAX_CONCURRENT_JOBS
        value: "2"
      - key: RENDER_MAX_QUEUE_DEPTH
        value: "20"
      - key: RENDER_SIGNED_URL_TTL_SECONDS
        value: "900"
