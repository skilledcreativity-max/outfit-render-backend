services:
  - type: web
    runtime: node
    name: outfit-render-backend
    buildCommand: npm ci --ignore-scripts && npm run audit && npm test
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: RENDER_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: APPROVED_PATTERN_ASSET_IDS
        sync: false
      - key: APPROVED_GRAPHIC_ASSET_IDS
        sync: false
      - key: RENDER_MAX_REQUESTS_PER_MINUTE
        value: "12"
      - key: RENDER_MAX_CONCURRENT_JOBS
        value: "1"
      - key: RENDER_MAX_QUEUE_DEPTH
        value: "4"
      - key: RENDER_DOWNLOAD_TTL_SECONDS
        value: "300"
      - key: RENDER_MAX_RETAINED_DOWNLOADS
        value: "10"
